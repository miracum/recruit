name: "k8s test"

on:
  workflow_call:
    inputs:
      image-tag:
        description: >-
          Image tag of the list and query-sql-on-fhir images to test with. Leave empty to use the
          tags baked into the chart's values.yaml, e.g. for forked PRs whose images are never pushed.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test installation on k8s
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build tester image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: false
          load: true
          context: src/
          file: src/tester/Dockerfile
          # this image is never pushed to a registry anyway, so we can
          # hard-code it here.
          tags: |
            ghcr.io/miracum/recruit/tester:v1

      - name: Create k8s KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind

      - name: Load tester image
        run: |
          kind load docker-image ghcr.io/miracum/recruit/tester:v1

      # TODO: consolidate with chaos-testing workflow
      - name: Install testing prerequisites
        run: |
          curl -sL -o - https://github.com/argoproj/argo-workflows/releases/download/v4.0.5/argo-linux-amd64.gz | gunzip > argo
          chmod +x ./argo

          kubectl create namespace recruit

          helm upgrade --install argo-workflows oci://ghcr.io/argoproj/argo-helm/argo-workflows \
            --create-namespace \
            -n argo-workflows \
            -f tests/chaos/argo-workflows-values.yaml \
            --version 1.0.13

      - name: Add helm repos and build deps of recruit chart
        run: |
          helm repo add hapifhir https://hapifhir.github.io/hapi-fhir-jpaserver-starter
          helm repo add maildev https://maildev.github.io/helm/
          helm dependency build charts/recruit

      - name: Install chart
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          image_args=()
          if [ -n "${IMAGE_TAG}" ]; then
            # image.repository is set to make it easier to run in forks - particularly to test releases.
            image_args=(
              --set "list.image.repository=${GITHUB_REPOSITORY}/list"
              --set "list.image.tag=${IMAGE_TAG}"
              --set "querySqlOnFhir.image.repository=${GITHUB_REPOSITORY}/query-sql-on-fhir"
              --set "querySqlOnFhir.image.tag=${IMAGE_TAG}"
            )
          fi

          helm install -n recruit \
            "${image_args[@]}" \
            -f charts/recruit/values-integrationtest.yaml \
            --wait --timeout=20m \
            recruit charts/recruit/

      - name: Run helm test
        run: |
          helm test -n recruit recruit

      - name: Run e2e testing workflow
        # TODO: the tester still asserts against the removed mailhog API, so this is expected to fail
        # until it's been migrated to maildev.
        continue-on-error: true
        run: |
          ./argo submit tests/integration/argo-workflow.yaml -n recruit --wait --log

      - name: Print cluster logs
        if: always()
        run: |
          kubectl cluster-info dump -o yaml | tee kind-cluster-dump.txt

      - name: Upload cluster dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-cluster-dump.txt
          path: |
            kind-cluster-dump.txt
