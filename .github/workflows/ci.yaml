name: ci
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types:
      # If you want a workflow to run when stable and pre-releases publish, subscribe to published instead of released and prereleased.
      # <https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release>
      - published
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

# cancel a superseded PR run (a new push to the same PR obsoletes the old one), but never cancel an
# in-progress push-to-master/release/merge_group run - those shouldn't be interrupted partway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # computes the one tag every image gets built/tagged under this run, mirroring the tag rules
  # docker/metadata-action used to apply for free per-job: pr-<number> for PRs, the branch name for
  # a push (ci.yaml only pushes on master), the release's own tag name for a release, and a sha
  # fallback for anything else (e.g. merge_group). standard-build-bake.yaml has no metadata-action
  # step of its own - bake-vars are opaque strings - so this replaces that.
  compute-tag:
    name: compute image tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute tag
        id: tag
        # values are passed through env rather than interpolated directly into the script -
        # github.ref_name/event.release.tag_name are attacker-controllable (a branch or release tag
        # name can contain arbitrary characters) and interpolating them straight into the run: block
        # would let that content be interpreted as shell syntax rather than as inert string data.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG_NAME}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            tag="${REF_NAME}"
          else
            tag="${SHA}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # builds every module's image from docker-bake.hcl in one docker buildx bake invocation, instead
  # of one job per module: the 4 Java modules share a base context/Dockerfile, so building them
  # together lets BuildKit share the COPY . . layer and the RUN --mount=type=cache Gradle
  # dependency cache across them - previously wasted, since separate jobs run on separate,
  # independent runners with no shared builder/cache state at all.
  build-bake:
    name: build images
    needs: compute-tag
    # granted for standard-build-bake.yaml's internal jobs, which (across build/image-provenance/
    # sign-images/attest-trivy-vulnerability-report/upload-*-to-release) need all of these.
    permissions:
      contents: write # to upload SBOMs/attestations to the GitHub release's assets
      pull-requests: write # for the trivy scan's PR comment
      security-events: write # for the trivy scan's Security tab reporting
      actions: read # for `gh attestation download` when uploading provenance to release assets
      packages: write # to push images, signatures, and attestations to ghcr.io
      id-token: write # for cosign keyless signing and attestation OIDC tokens
      attestations: write # to publish build provenance/SLSA attestations
      artifact-metadata: write # required alongside attestations: write by the attestation API
    uses: miracum/.github/.github/workflows/standard-build-bake.yaml@e4ffde9d9ab4d3f0444077376c6da329a40db400 # v1.24.3
    with:
      bake-files: docker-bake.hcl
      bake-vars: |
        REGISTRY=ghcr.io/${{ github.repository }}
        TAG=${{ needs.compute-tag.outputs.tag }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # extracts the 4 digests release.yaml needs by target name from build-bake's images JSON, so
  # release.yaml's own interface (4 named *-image-digest inputs) doesn't have to change.
  compute-digests:
    name: compute release image digests
    runs-on: ubuntu-24.04
    needs: build-bake
    outputs:
      query: ${{ steps.digests.outputs.query }}
      notify: ${{ steps.digests.outputs.notify }}
      list: ${{ steps.digests.outputs.list }}
      query-sql-on-fhir: ${{ steps.digests.outputs.query-sql-on-fhir }}
    steps:
      - name: Extract digests
        id: digests
        env:
          IMAGES: ${{ needs.build-bake.outputs.images }}
        run: |
          for t in query notify list query-sql-on-fhir; do
            digest="$(jq -r --arg t "${t}" '.[] | select(.target==$t) | .digest' <<<"${IMAGES}")"
            echo "${t}=${digest}" >> "$GITHUB_OUTPUT"
          done

  # build-bake's images output includes the *-test build-gate targets too - filters those out
  # (along with list-next, not part of this test job's matrix today either - see ci.yaml history)
  # and joins in the e2e-test-directory each module used to carry as a static matrix.include field,
  # which bake has no notion of.
  compute-test-matrix:
    name: compute test matrix
    runs-on: ubuntu-24.04
    needs: build-bake
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: matrix
        env:
          IMAGES: ${{ needs.build-bake.outputs.images }}
        run: |
          matrix="$(jq -c '
            {"query":"tests/e2e/","notify":"tests/e2e/","list":"frontend/tests/e2e/"} as $e2e
            | [ .[] | select((.target | endswith("-test") | not) and .target != "list-next")
                | . + {"e2eTestDirectory": ($e2e[.target] // "")} ]
          ' <<<"${IMAGES}")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  publish-pr-helm-chart:
    name: publish pr helm chart
    # only for same-repo PRs: forked PRs don't get a GITHUB_TOKEN with packages:write.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # to push the PR's pre-release Helm chart to ghcr.io
    needs:
      - compute-tag
      - build-bake
    env:
      IMAGE_TAG: ${{ needs.compute-tag.outputs.tag }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add helm repos and build chart dependencies
        run: |
          helm repo add hapifhir https://hapifhir.github.io/hapi-fhir-jpaserver-starter
          helm dependency build charts/recruit

      - name: Point chart at this PR's images and version it as a pre-release
        run: |
          for key in query notify list querySqlOnFhir listNext; do
            yq -i ".${key}.image.tag = \"${IMAGE_TAG}\"" charts/recruit/values.yaml
          done
          yq -i ".version = \"0.0.0-pr${PR_NUMBER}\" | .appVersion = \"${IMAGE_TAG}\"" charts/recruit/Chart.yaml

      - name: Package and push Helm chart
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          helm package charts/recruit/
          helm push "recruit-0.0.0-pr${PR_NUMBER}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY}/charts"

  test:
    name: test
    runs-on: ubuntu-24.04
    needs:
      - compute-tag
      - build-bake
      - compute-test-matrix
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.compute-test-matrix.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
      IMAGE_TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: /tmp/images

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE_SLUG: ${{ matrix.image.slug }}
        run: |
          ls -lsa /tmp/images
          docker load --input "/tmp/images/${IMAGE_SLUG}.tar"
          docker image ls

      - name: Pull image if not in PR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker image ls -a

      - name: Run container structure tests
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64

          ./container-structure-test-linux-amd64 test --image="${IMAGE_NAME}:${IMAGE_TAG}" --config=tests/container-structure/common-tests.yaml

      - name: Run isolated smoke test
        if: ${{ matrix.image.e2eTestDirectory != ''}}
        working-directory: src/${{ matrix.image.target }}
        env:
          E2E_TEST_DIRECTORY: ${{ matrix.image.e2eTestDirectory }}
        run: |
          docker compose -f "${E2E_TEST_DIRECTORY}/docker-compose.yaml" build
          docker compose -f "${E2E_TEST_DIRECTORY}/docker-compose.yaml" run tester

      - name: Print test logs and stop all running containers
        if: ${{ matrix.image.e2eTestDirectory != '' && always()}}
        working-directory: src/${{ matrix.image.target }}
        continue-on-error: true
        env:
          E2E_TEST_DIRECTORY: ${{ matrix.image.e2eTestDirectory }}
        run: |
          docker compose -f "${E2E_TEST_DIRECTORY}/docker-compose.yaml" logs
          docker compose -f "${E2E_TEST_DIRECTORY}/docker-compose.yaml" down --volumes --remove-orphans

  k8s-test:
    needs:
      - compute-tag
      - build-bake
      - test
    uses: ./.github/workflows/test-k8s-installation.yaml
    with:
      image-tag: ${{ needs.compute-tag.outputs.tag }}

  docker-compose-test:
    needs:
      - compute-tag
      - build-bake
      - test
    uses: ./.github/workflows/test-compose-installation.yaml
    with:
      image-tag: ${{ needs.compute-tag.outputs.tag }}

  release:
    # the docker compose image tags only change on releases, so
    # it's sufficient to just run tests then.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      actions: read # for the build provenance attestation step in release.yaml's prepare-artifacts
      attestations: write # release.yaml's prepare-artifacts job attests the release checksums
      contents: write # for release notes
      id-token: write # for creating OIDC tokens for signing
      packages: write # for uploading container images, signatures, and attestations.
    needs:
      - k8s-test
      - docker-compose-test
      # listed directly (even though it's already transitively required via k8s-test/
      # docker-compose-test) so its per-module digest outputs are addressable here.
      - compute-digests
    uses: ./.github/workflows/release.yaml
    with:
      query-image-digest: ${{ needs.compute-digests.outputs.query }}
      notify-image-digest: ${{ needs.compute-digests.outputs.notify }}
      list-image-digest: ${{ needs.compute-digests.outputs.list }}
      query-sql-on-fhir-image-digest: ${{ needs.compute-digests.outputs.query-sql-on-fhir }}
    secrets:
      token: ${{ secrets.MIRACUM_BOT_SEMANTIC_RELEASE_TOKEN }}

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@7eaa603620c450f73fd25d6b68c37795ef4be999 # v1.22.8
    permissions:
      contents: read
      pull-requests: write # for MegaLinter's PR comment with lint results
      issues: write # for MegaLinter's PR comment/annotations
      security-events: write # for uploading CodeQL's SARIF results to the Security tab
      actions: read # required by the CodeQL analysis steps
    with:
      enable-validate-gradle-wrapper: false
      codeql-languages: '["javascript", "java"]'
      enable-codeql: true
      java-version: "25"
      enable-verify-base-image-signature: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
