name: ci
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types:
      # If you want a workflow to run when stable and pre-releases publish, subscribe to published instead of released and prereleased.
      # <https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release>
      - published
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

# cancel a superseded PR run (a new push to the same PR obsoletes the old one), but never cancel an
# in-progress push-to-master/release/merge_group run - those shouldn't be interrupted partway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build-list:
    name: build list
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@6611917e0cbce3777825e93e3f725c98a437c060 # v1.31.0
    with:
      image: ghcr.io/${{ github.repository }}/list
      build-context: "src/list/"
      enable-buildkit-cache-mount-caching: true

  build-query-sql-on-fhir:
    name: build query-sql-on-fhir
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@6611917e0cbce3777825e93e3f725c98a437c060 # v1.31.0
    with:
      image: ghcr.io/${{ github.repository }}/query-sql-on-fhir
      build-context: "src/"
      enable-build-test-layer: true
      enable-build-cache: false
      enable-buildkit-cache-mount-caching: true
      build-args: |
        MODULE_NAME=query-sql-on-fhir

  build-superset-library-sync:
    name: build superset-library-sync
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@6611917e0cbce3777825e93e3f725c98a437c060 # v1.31.0
    with:
      image: ghcr.io/${{ github.repository }}/superset-library-sync
      build-context: "src/"
      enable-build-test-layer: true
      enable-build-cache: false
      enable-buildkit-cache-mount-caching: true
      build-args: |
        MODULE_NAME=superset-library-sync

  chart:
    name: chart
    needs:
      # for their image-version/image-digest outputs
      - build-list
      - build-query-sql-on-fhir
      # only lint, install, and publish the chart once the images it points at have passed all tests
      # (both of these already depend on the container structure `test` job).
      - k8s-test
      - docker-compose-test
    uses: miracum/.github/.github/workflows/standard-chart-publish.yaml@6611917e0cbce3777825e93e3f725c98a437c060 # v1.31.0
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for keyless chart signing and OIDC-based attestations
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      chart-path: charts/recruit
      # published as ghcr.io/miracum/recruit/charts/recruit rather than the default
      # ghcr.io/miracum/recruit/recruit, matching the location the chart has always been published to.
      registry: ghcr.io/${{ github.repository }}/charts
      # stable per PR (no commit sha), so every push to the same PR overwrites this one OCI tag
      # instead of piling up a new prerelease version per commit. Empty on every other event,
      # which falls back to the workflow's own default: release events use the release tag,
      # everything else uses Chart.yaml's version.
      version: ${{ github.event_name == 'pull_request' && format('0.0.0-pr{0}', github.event.pull_request.number) || '' }}
      # the image tag is the same for all modules, so it doesn't matter which build job we read it from.
      app-version: ${{ github.event_name == 'pull_request' && needs.build-list.outputs.image-version || '' }}
      lint-config: .github/ct/ct.yaml
      install-config: .github/ct/install.yaml
      extra-helm-repos: |
        hapifhir=https://hapifhir.github.io/hapi-fhir-jpaserver-starter
      # test ct install against the images this PR just built instead of the tags baked into
      # values.yaml. Restricted to same-repo PRs: forked PRs never get their images pushed to
      # ghcr.io, so kind wouldn't be able to pull them - falls back to the chart's default tags there.
      helm-extra-set-args: >-
        ${{
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)
          && format('--set=listNext.image.tag={0},querySqlOnFhir.image.tag={0}', needs.build-list.outputs.image-version)
          || ''
        }}
      # pins every app image in the published chart to the exact digest its build job produced. On PRs
      # the tag is also replaced with the PR's image tag, so the PR chart deploys the PR's images; on
      # releases the release-please managed tag in values.yaml is kept, i.e. `v1.2.3@sha256:...`.
      # The chart is only published on those two events, so this has no effect on any other.
      images: |
        .listNext.image.tag=${{ github.event_name == 'pull_request' && needs.build-list.outputs.image-version || '' }}@${{ needs.build-list.outputs.image-digest }}
        .querySqlOnFhir.image.tag=${{ github.event_name == 'pull_request' && needs.build-query-sql-on-fhir.outputs.image-version || '' }}@${{ needs.build-query-sql-on-fhir.outputs.image-digest }}

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - build-query-sql-on-fhir
      - build-superset-library-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "query-sql-on-fhir"
          - module: "superset-library-sync"
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.module }}
      # the image tag is the same for all modules, so it doesn't matter which build job we read it from.
      IMAGE_TAG: ${{ needs.build-query-sql-on-fhir.outputs.image-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # unfortunately we need to re-compute the artifact name as we can't access the matrix job's outputs.
      - uses: rlespinasse/slugify-value@a4879db1eb3db9bbee01dca36f98a8236c2b8239 # v1.4.0
        id: slugify-image
        with:
          key: BUILD_IMAGE
          value: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          publish-env: false
          slug-maxlength: nolimit

      - name: Download image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.slugify-image.outputs.slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lsa /tmp
          docker load --input /tmp/image.tar
          docker image ls

      - name: Pull image if not in PR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker image ls -a

      - name: Run container structure tests
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64

          ./container-structure-test-linux-amd64 test --image="${IMAGE_NAME}:${IMAGE_TAG}" --config=tests/container-structure/common-tests.yaml

  k8s-test:
    needs:
      - build-query-sql-on-fhir
      - build-list
      - test
    uses: $/.github/workflows/test-k8s-installation.yaml
    with:
      image-tag: ${{ needs.build-query-sql-on-fhir.outputs.image-version }}

  docker-compose-test:
    needs:
      - build-query-sql-on-fhir
      - build-list
      - test
    uses: $/.github/workflows/test-compose-installation.yaml
    with:
      image-tag: ${{ needs.build-query-sql-on-fhir.outputs.image-version }}

  release:
    # the docker compose image tags only change on releases, so
    # it's sufficient to just run tests then.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      actions: read # for the build provenance attestation step in release.yaml's prepare-artifacts
      attestations: write # release.yaml's prepare-artifacts job attests the release checksums
      contents: write # for release notes
      id-token: write # for creating OIDC tokens for signing
      packages: read # to pull the published Helm chart from ghcr.io
    needs:
      - k8s-test
      - docker-compose-test
      # listed directly (even though they're already transitively required via k8s-test/
      # docker-compose-test) so their per-module image-digest outputs are addressable here.
      - build-query-sql-on-fhir
      - build-list
      - chart
    uses: $/.github/workflows/release.yaml
    with:
      list-image-digest: ${{ needs.build-list.outputs.image-digest }}
      query-sql-on-fhir-image-digest: ${{ needs.build-query-sql-on-fhir.outputs.image-digest }}
      chart-name: ${{ needs.chart.outputs.chart-name }}
      chart-version: ${{ needs.chart.outputs.chart-version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@6611917e0cbce3777825e93e3f725c98a437c060 # v1.31.0
    permissions:
      contents: read
      pull-requests: write # for MegaLinter's PR comment with lint results
      issues: write # for MegaLinter's PR comment/annotations
      security-events: write # for uploading CodeQL's SARIF results to the Security tab
      actions: read # required by the CodeQL analysis steps
    with:
      enable-validate-gradle-wrapper: false
      codeql-languages: '["java", "csharp"]'
      enable-codeql: true
      java-version: "25"
