name: lint helm chart

on:
  pull_request:
    branches:
      - master

# a new push to the same PR or branch supersedes the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-26.04
    container: ghcr.io/chgl/kube-powertools:v2.5.60@sha256:4292fd9aac961b4a47a8092f0a85aefcae9c07ccdc8c70ba91bda89b84edc802
    steps:
      - name: Add workspace as safe directory
        run: |
          git config --global --add safe.directory /__w/recruit/recruit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # docs up-to-date checks and ct lint/install run in ci.yaml's chart job via
      # miracum/.github's standard-chart-publish workflow. This only covers the extra checks that
      # workflow doesn't do.
      - name: Add helm repos and update deps
        run: |
          helm repo add hapifhir https://hapifhir.github.io/hapi-fhir-jpaserver-starter
          helm repo add maildev https://maildev.github.io/helm/
          helm dependency update charts/recruit

      - name: Run ArtifactHub lint
        run: ah lint --kind=helm

      - name: Cache kubeconform schemas
        id: cache-powerlint-kubeconform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp
          key: ${{ runner.os }}-powerlint-kubeconform

      - name: Run Powerlint
        env:
          KUBERNETES_VERSIONS: "1.33.0 1.34.0 1.35.0"
        run: chart-powerlint.sh

      # used to test whether the changelog generation process works
      - name: Generate changelogs (test)
        run: generate-chart-changelog.sh
