name: build-docs
on:
  pull_request:
    branches:
      - master
    paths:
      - docs/**
      - overrides/**
      - fhir/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-docs.yaml
  # publish the documentation together with each release, so the site never describes unreleased features
  release:
    types:
      - published
  # re-publish from master without cutting a release, e.g. after fixing a typo
  workflow_dispatch: {}

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  build-ig:
    name: Build FHIR IG
    runs-on: ubuntu-26.04
    container: ghcr.io/miracum/ig-build-tools:v2.2.48@sha256:15cdabfe5eccf66da197b19fa4e723ff7ba80ac127948d3bcf1164b5631dccc8
    steps:
      - name: Add workspace as safe directory
        run: |
          git config --global --add safe.directory /__w/recruit/recruit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # only pull request runs restore the cache: release and workflow_dispatch runs publish the
      # site, so they only check for an entry and never restore anything another run could have written.
      # zizmor can't evaluate the lookup-only expression, hence the ignore.
      - name: Cache FHIR packages # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.fhir/packages
          key: fhir-packages-${{ hashFiles('fhir/package.json') }}
          lookup-only: ${{ github.event_name != 'pull_request' }}

      - name: Build FHIR IG
        working-directory: fhir/ig
        run: java -jar /usr/local/bin/publisher.jar -ig ig.ini -tx n/a

      - name: Upload FHIR IG output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fhir-ig
          path: fhir/ig/output
          retention-days: 1

  build-site:
    name: Build Documentation
    needs:
      - build-ig
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # this workflow publishes the site, so it must not restore anything a pull request run
          # could have written
          enable-cache: false

      # --strict fails the build on broken links between pages.
      - name: Build site
        run: uv run --locked zensical build --strict

      - name: Download FHIR IG output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fhir-ig
          path: site/fhir

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 7

  deploy:
    name: Deploy Documentation
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs:
      - build-site
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
