name: test-docker-compose
on:
  workflow_call:
    inputs:
      image-tag:
        description: "Name of the image tag to test with"
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test Compose installation
    runs-on: ubuntu-26.04
    env:
      RECRUIT_IMAGE_BASE_NAME: ghcr.io/${{ github.repository }}
      RECRUIT_IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download list image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr.io-miracum-recruit-list-${{ inputs.image-tag }}
          path: /tmp/ghcr.io-miracum-recruit-list-${{ inputs.image-tag }}

      - name: Download notify image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr.io-miracum-recruit-notify-${{ inputs.image-tag }}
          path: /tmp/ghcr.io-miracum-recruit-notify-${{ inputs.image-tag }}

      - name: Download query image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr.io-miracum-recruit-query-${{ inputs.image-tag }}
          path: /tmp/ghcr.io-miracum-recruit-query-${{ inputs.image-tag }}

      - name: Download query-sql-on-fhir image artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr.io-miracum-recruit-query-sql-on-fhir-${{ inputs.image-tag }}
          path: /tmp/ghcr.io-miracum-recruit-query-sql-on-fhir-${{ inputs.image-tag }}

      - name: Load container images
        # only load images from artifacts on PRs, otherwise the image
        # is already pushed and tagged in the registry
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          docker load --input "/tmp/ghcr.io-miracum-recruit-list-${IMAGE_TAG}/image.tar"
          docker load --input "/tmp/ghcr.io-miracum-recruit-notify-${IMAGE_TAG}/image.tar"
          docker load --input "/tmp/ghcr.io-miracum-recruit-query-${IMAGE_TAG}/image.tar"
          docker load --input "/tmp/ghcr.io-miracum-recruit-query-sql-on-fhir-${IMAGE_TAG}/image.tar"
          docker image ls -a

      - name: Deploy using Docker Compose in staging mode
        run: |
          docker compose \
            --project-name=recruit \
            --env-file=docker-compose/.staging.env \
            -f docker-compose/docker-compose.yaml \
            -f docker-compose/docker-compose.staging.yaml up --detach

      - name: List containers
        run: |
          docker compose \
            --project-name=recruit \
            --env-file=docker-compose/.staging.env \
            -f docker-compose/docker-compose.yaml \
            -f docker-compose/docker-compose.staging.yaml ps

      - name: Run basic health probes
        run: |
          docker compose \
            --project-name=recruit \
            --env-file=docker-compose/.staging.env \
            -f docker-compose/docker-compose.yaml \
            -f docker-compose/docker-compose.staging.yaml \
            -f docker-compose/docker-compose.probe.yaml run health-probes

      - name: Display logs
        if: always()
        run: |
          docker compose \
            --project-name=recruit \
            --env-file=docker-compose/.staging.env \
            -f docker-compose/docker-compose.yaml \
            -f docker-compose/docker-compose.staging.yaml logs
