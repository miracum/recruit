postgres:
  fullnameOverride: recruit-demo-postgres
  initdb:
    scripts:
      init-databases.sql: |
        CREATE DATABASE fhir;
        CREATE DATABASE hive_metastore;

fhirserver:
  resourcesPreset: large
  postgres:
    enabled: false
  externalDatabase:
    host: recruit-demo-postgres
    user: postgres
    database: fhir
    existingSecret: recruit-demo-postgres
    existingSecretKey: postgres-password

querySqlOnFhir:
  enabled: true
  schedule: "0 * * * * *"
  trino:
    auth:
      username: trino
  extraEnv:
    - name: QUERY_SQL_ON_FHIR_FUNNEL_ENABLED
      value: "true"

sampleStudy:
  enabled: true

analytics-on-fhir:
  enabled: true
  hive-metastore:
    postgres:
      enabled: false
    database:
      host: recruit-demo-postgres
      username: postgres
      database: hive_metastore
      existingSecret:
        name: recruit-demo-postgres
        key: postgres-password
  trino:
    coordinator:
      jvm:
        maxHeapSize: "2G"
    worker:
      jvm:
        maxHeapSize: "2G"
