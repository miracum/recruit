fhirserver:
  resourcesPreset: "none"
  postgres:
    auth:
      # kics-scan ignore-line
      postgresPassword: fhir

query:
  resourcesPreset: "none"
  # run every minute
  schedule: "* * * * *"
  cohortSelectorLabels: []
  omop:
    host: broadsea-atlasdb
    port: 5432
    database: postgres
    username: postgres
    # kics-scan ignore-line
    password: mypass
    resultsSchema: demo_cdm_results
    cdmSchema: demo_cdm
  webAPI:
    dataSource: EUNOMIA
  extraEnv:
    - name: QUERY_WEBAPI_COHORT_CACHE_SCHEMA
      value: webapi

postgres:
  resourcesPreset: "none"
  enabled: true
  auth:
    # kics-scan ignore-line
    postgresPassword: recruit-notify-ha

ohdsi:
  postgres:
    enabled: false
  webApi:
    resourcesPreset: "none"
    db:
      host: broadsea-atlasdb
      port: 5432
      database: "postgres"
      username: "postgres"
      # kics-scan ignore-line
      password: "mypass"
      schema: "webapi"
    extraEnv:
      - name: FLYWAY_BASELINEONMIGRATE
        value: "true"
      - name: FLYWAY_TABLE
        value: schema_history
      - name: flyway_baselineVersionAsString
        value: "2.2.5.20180212152023"
      - name: FLYWAY_BASELINEDESCRIPTION
        value: "Base Migration"
      - name: FLYWAY_LOCATIONS
        value: "classpath:db/migration/postgresql"
  cdmInitJob:
    enabled: false
  atlas:
    resourcesPreset: "none"
  achilles:
    resourcesPreset: "none"
    schemas:
      cdm: "demo_cdm"
      vocab: "demo_cdm"
      res: "demo_cdm_results"
    sourceName: "EUNOMIA"

broadseaAtlasdb:
  enabled: true
