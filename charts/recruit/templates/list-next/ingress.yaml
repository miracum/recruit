{{- if and .Values.listNext.enabled .Values.listNext.ingress.enabled -}}
{{- $fullName := include "recruit.fullname" . -}}
{{- $serviceName := printf "%s-list-next" $fullName -}}
{{- $servicePort := .Values.listNext.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
    app.kubernetes.io/component: list-next
  {{- with .Values.listNext.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.listNext.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
{{- if .Values.listNext.ingress.tls }}
  tls:
  {{- range .Values.listNext.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- range .Values.listNext.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $serviceName }}
                port:
                  {{- if kindIs "float64" $servicePort }}
                  number: {{ $servicePort }}
                  {{- else }}
                  name: {{ $servicePort }}
                  {{- end }}
        {{- end }}
  {{- end }}
{{- end }}
