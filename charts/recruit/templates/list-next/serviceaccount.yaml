{{- if .Values.listNext.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recruit.fullname" . }}-list-next
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
  {{- with .Values.listNext.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
