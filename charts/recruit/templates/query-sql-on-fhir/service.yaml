{{- with .Values.querySqlOnFhir -}}
{{- if .enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "recruit.fullname" $ }}-query-sql-on-fhir
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: query-sql-on-fhir
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .service.metricsPort }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    {{- include "recruit.matchLabels" $ | nindent 4 }}
    app.kubernetes.io/component: query-sql-on-fhir
{{- end -}}
{{- end -}}
