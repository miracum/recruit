{{- if .Values.querySqlOnFhir.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recruit.fullname" . }}-query-sql-on-fhir
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
  {{- with .Values.querySqlOnFhir.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
