{{- with .Values.grafanaDashboard -}}
{{- if .enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" $ }}-grafana-dashboard
  namespace: {{ .namespace | default $.Release.Namespace }}
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboard
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  recruit.json: |
    {{- $.Files.Get "files/dashboards/recruit.json" | nindent 4 }}
{{- end -}}
{{- end -}}
