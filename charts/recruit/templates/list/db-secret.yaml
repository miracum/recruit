{{- if and .Values.list.enabled .Values.list.database.username (not .Values.list.database.existingSecret.name) (not (include "recruit.list.database.useIncludedPostgres" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) "list-db" }}
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
    app.kubernetes.io/component: list
type: Opaque
data:
  db-password: {{ .Values.list.database.password | b64enc | quote }}
{{- end }}
