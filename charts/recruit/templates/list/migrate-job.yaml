{{- with .Values.list -}}
{{- if .enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "recruit.list.migrationJobName" $ }}
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: list-migrate
spec:
  backoffLimit: {{ .migrationJob.backoffLimit }}
  {{- with .migrationJob.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .migrationJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "recruit.labels" $ | nindent 8 }}
        app.kubernetes.io/component: list-migrate
    spec:
      restartPolicy: Never
      # This pod never talks to the Kubernetes API - only the Deployment's wait-for-migration
      # initContainer does (see deployment.yaml).
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      {{- if (include "recruit.list.database.useIncludedPostgres" $) }}
      initContainers:
        - name: wait-for-db
          image: {{ include "recruit.waitforDB.image" $ }}
          imagePullPolicy: {{ $.Values.waitForPostgresInitContainer.image.pullPolicy }}
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PGHOST
              value: {{ include "recruit.postgresql.fullname" $ | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ include "recruit.list.database.username" $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready; do
                echo "Waiting for DB ${PGUSER}@${PGHOST}:${PGPORT} to be up";
                sleep 5;
              done;
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          {{- if .migrationJob.resources }}
          resources: {{- toYaml .migrationJob.resources | nindent 12 }}
          {{- else if ne .migrationJob.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .migrationJob.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: RunMigrationsOnly
              value: "true"
            - name: ConnectionStrings__AppDb
              value: {{ include "recruit.list.database.connectionString" $ }}
            {{- with (include "recruit.list.database.username" $) }}
            - name: PGUSER
              value: {{ . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "recruit.list.database.secretName" $ }}
                  key: {{ include "recruit.list.database.secretKey" $ }}
            {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.names.fullname" $ }}-list-wait-for-migration
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: list
rules:
  # Only "get" - the wait-for-migration initContainer only ever does `kubectl get job <name>`,
  # never list/watch. (Also: resourceNames doesn't restrict list/watch in RBAC, so scoping those
  # verbs here would be misleading - they'd effectively apply namespace-wide, not just to this Job.)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames:
      - {{ include "recruit.list.migrationJobName" $ }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" $ }}-list-wait-for-migration
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "common.names.fullname" $ }}-list-wait-for-migration
subjects:
  - kind: ServiceAccount
    name: {{ include "recruit.serviceAccountName" (dict "context" . "component" "list" "root" $) }}
    namespace: {{ $.Release.Namespace }}
{{- end -}}
{{- end -}}
