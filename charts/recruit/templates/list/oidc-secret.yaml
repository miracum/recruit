{{- if and .Values.list.enabled .Values.list.auth.enabled (not .Values.list.auth.oidc.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" .Release.Name "list-oidc" }}
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
    app.kubernetes.io/component: list
type: Opaque
data:
  oidc-client-secret: {{ .Values.list.auth.oidc.clientSecret | b64enc | quote }}
{{- end }}
