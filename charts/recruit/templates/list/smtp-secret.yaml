{{- if and .Values.list.enabled (not .Values.list.notifyMailer.smtp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" (include "common.names.fullname" .) "list-smtp" }}
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
    app.kubernetes.io/component: list
type: Opaque
data:
  {{- if .Values.maildev.enabled }}
  smtp-password: ""
  {{- else }}
  smtp-password: {{ .Values.list.notifyMailer.smtp.password | b64enc | quote }}
  {{- end }}
{{- end }}
