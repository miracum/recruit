{{- with .Values.list -}}
{{- if .enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" $ }}-list
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: list
spec:
  type: {{ .service.type }}
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .service.metricsPort }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    {{- include "common.labels.matchLabels" $ | nindent 4 }}
    app.kubernetes.io/component: list
{{- end -}}
{{- end -}}
