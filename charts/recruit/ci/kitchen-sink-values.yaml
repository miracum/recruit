podAnnotations:
  linkerd.io/inject: "enabled"

list:
  podDisruptionBudget:
    enabled: true
  replicaCount: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: recruit
          app.kubernetes.io/instance: recruit
          app.kubernetes.io/component: list
  ingress:
    enabled: true
    hosts:
      - host: recruit-list.127.0.0.1.nip.io
        paths:
          - "/"
  metrics:
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: kube-prom-stack
  extraEnv:
    - name: LOG_LEVEL
      value: "debug"
query:
  metrics:
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: kube-prom-stack

postgres:
  enabled: true
  auth:
    # kics-scan ignore-line
    postgresPassword: recruit-notify-ha
  primary:
    service:
      annotations:
        config.linkerd.io/opaque-ports: "5432"

ohdsi:
  ingress:
    enabled: true
    hosts:
      - host: recruit-ohdsi.127.0.0.1.nip.io
  postgres:
    auth:
      # kics-scan ignore-line
      postgresPassword: ohdsi
    primary:
      service:
        annotations:
          config.linkerd.io/opaque-ports: "5432"
      resources:
        limits:
          memory: 2Gi
          cpu: 1000m
  atlas:
    replicaCount: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ohdsi
            app.kubernetes.io/instance: recruit
            app.kubernetes.io/component: atlas
    podAnnotations:
      linkerd.io/inject: "enabled"
  webApi:
    podAnnotations:
      linkerd.io/inject: "enabled"
  achilles:
    enabled: false

fhirserver:
  replicaCount: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: fhirserver
          app.kubernetes.io/instance: recruit
  ingress:
    enabled: true
    hosts:
      - host: recruit-fhir-server.127.0.0.1.nip.io
        pathType: ImplementationSpecific
        paths: ["/"]
  postgres:
    auth:
      # kics-scan ignore-line
      postgresPassword: fhir
    primary:
      service:
        annotations:
          config.linkerd.io/opaque-ports: "5432"
  podAnnotations:
    linkerd.io/inject: "enabled"
  metrics:
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: kube-prom-stack

mailhog:
  automountServiceAccountToken: true
  podAnnotations:
    linkerd.io/inject: "enabled"
