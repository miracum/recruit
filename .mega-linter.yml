# Configuration file for MegaLinter
# See all available variables at https://oxsecurity.github.io/megalinter/configuration/ and in linters documentation

IGNORE_GITIGNORED_FILES: true

# all, none, or list of linter keys
APPLY_FIXES: none
DISABLE_LINTERS:
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - COPYPASTE_JSCPD
  - REPOSITORY_DEVSKIM
  - SPELL_PROSELINT
  - SPELL_CSPELL
  - JAVASCRIPT_STANDARD
  - SQL_TSQLLINT
  - PYTHON_PYLINT
  - JAVA_PMD
  - PYTHON_PYRIGHT
  # error - python package "--hash" is available for public registration. /github/workspace/src/query/tests/e2e/requirements.txt
  - REPOSITORY_DUSTILOCK
  # too many false-positives and takes forever
  - YAML_V8R
  # seems to ignore yamllint config file entirely
  - YAML_YAMLLINT
  - SPELL_LYCHEE
  # failing on previously existing CVEs in PRs isn't entirely helpful.
  # ideally should be part of a regularly scheduled check instead
  - REPOSITORY_GRYPE
  # done by csharpier
  - CSHARP_DOTNET_FORMAT
  - REPOSITORY_KINGFISHER
  # redundant with trivy
  - REPOSITORY_OSV_SCANNER

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
# DISABLE_ERRORS: true # Uncomment if you want MegaLinter to detect errors but not block CI to pass

BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (fhir/ig)

# auto-generated by fsh-sushi build, missing final newlines upstream; approved.fhir.json are
# ApprovalTests snapshots and shouldn't be hand-edited to add a trailing newline
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (fhir/ig/fsh-generated/|\.approved\.fhir\.json$)

# same generated/snapshot files as above, plus the search-parameters-transaction-upsert.json
# symlinks into fhir/ig/fsh-generated/: prettier refuses to run on a symlink that's passed
# to it explicitly (rather than discovered via glob), which is how MegaLinter invokes it
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: (fhir/ig/fsh-generated/|\.approved\.fhir\.json$|/search-parameters-transaction-upsert\.json$)

# vendored third-party library, not project source - don't reformat it away from upstream
CSS_STYLELINT_FILTER_REGEX_EXCLUDE: (wwwroot/lib/)

BASH_SHFMT_ARGUMENTS:
  - "--indent=2"

ADDITIONAL_EXCLUDED_DIRECTORIES:
  - "node_modules"

GROOVY_NPM_GROOVY_LINT_ARGUMENTS:
  - "--failon=warning"

JAVA_CHECKSTYLE_CONFIG_FILE: src/config/checkstyle/checkstyle.xml

REPOSITORY_TRIVY_ARGUMENTS:
  - "--severity=HIGH,CRITICAL"
  - "--ignore-unfixed"

REPOSITORY_CHECKOV_ARGUMENTS:
  - "--skip-path=tests/"
  - "--skip-path=src/hack/"
  - "--skip-path=docker-compose/"
  - "--skip-path=src/list/frontend/deploy/data/"

REPOSITORY_KICS_ARGUMENTS:
  - --fail-on=HIGH

REPOSITORY_KICS_CONFIG_FILE: .kics.yaml

DISABLE_ERRORS_LINTERS:
  - REPOSITORY_TRIVY
  - REPOSITORY_KICS

ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
