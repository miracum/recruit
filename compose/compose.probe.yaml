services:
  health-probes:
    image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 32m
    privileged: false
    read_only: true
    user: 65532:65532
    command: >
      sh -euxc "curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://fhir:8080/fhir/metadata?_summary=true &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://query-sql-on-fhir:8080/actuator/health &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://list:8080/healthz &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://maildev:1080/healthz
    depends_on:
      - fhir
      - query-sql-on-fhir
      - list
      - maildev
