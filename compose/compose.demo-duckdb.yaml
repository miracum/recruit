# A lightweight alternative to the Trino-based demo, applied on top of compose.demo.yaml:
# query-sql-on-fhir queries the Synthea bulk export's NDJSON files directly via an embedded,
# in-memory DuckDB instead of Delta Lake tables via Trino, so none of the lakehouse services
# (SeaweedFS, the Delta conversion, the Hive metastore, Trino) are started.
#
#   docker compose --project-name=recruit-demo \
#     --env-file=compose/.demo.env \
#     -f compose/compose.yaml \
#     -f compose/compose.demo.yaml \
#     -f compose/compose.demo-duckdb.yaml up --detach --wait
services:
  query-sql-on-fhir:
    environment:
      QUERY_SQL_ON_FHIR_SQL_DIALECT: duckdb
      SPRING_DATASOURCE_URL: "jdbc:duckdb:"
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.duckdb.DuckDBDriver
      # every `jdbc:duckdb:` connection is its own, empty in-memory database, so each pooled
      # connection creates the views over the NDJSON files itself. They're named like the Delta
      # tables queried via Trino, so the criteria's SQL only differs where the dialects do.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: |
        ATTACH ':memory:' AS fhir;
        CREATE SCHEMA fhir."default";
        CREATE VIEW fhir."default".patient AS SELECT * FROM read_json('/data/fhir/Patient.ndjson');
        CREATE VIEW fhir."default".condition AS SELECT * FROM read_json('/data/fhir/Condition.ndjson');
        CREATE VIEW fhir."default".encounter AS SELECT * FROM read_json('/data/fhir/Encounter.ndjson');
        CREATE VIEW fhir."default".observation AS SELECT * FROM read_json('/data/fhir/Observation.ndjson');
        CREATE VIEW fhir."default".location AS SELECT * FROM read_json('/data/fhir/Location.ndjson');
        USE fhir."default";
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "2"
    # replaces compose.yaml's /tmp tmpfs: the DuckDB JDBC driver extracts its ~60 MiB native
    # library to /tmp and loads it from there, which needs the mount to be large enough and to
    # allow executing files (tmpfs mounts are noexec by default).
    tmpfs:
      - /tmp:exec,size=128m
    volumes: !override
      # a symlink to src/hack/synthea/bulk/fhir/ in the repository; the release bundle contains
      # the dereferenced files. The same patients are loaded into the FHIR server by
      # load-sample-resources.
      - ./demo/synthea-bulk:/data/fhir:ro
    depends_on: !override
      load-sample-resources:
        condition: service_completed_successfully

  ready:
    depends_on: !override
      load-sample-resources:
        condition: service_completed_successfully
      query-sql-on-fhir:
        condition: service_started
      list:
        condition: service_started
      maildev:
        condition: service_started

  # only needed for querying via Trino - not started unless the `trino` profile is enabled
  seaweedfs:
    profiles: ["trino"]
  convert-to-delta:
    profiles: ["trino"]
  warehousekeeper:
    profiles: ["trino"]
  hive-metastore:
    profiles: ["trino"]
  trino:
    profiles: ["trino"]
