{#- The recruIT mark, in the variant matching the current color scheme. Both
images are rendered and _css/extra.css hides the one that doesn't match, so the
logo follows the light/dark toggle. -#}
<img
  class="rc-logo rc-logo--light"
  src="{{ '_img/logo/web/mark-light-96.png' | url }}"
  alt="{{ config.site_name }}"
  width="96"
  height="96"
/>
<img
  class="rc-logo rc-logo--dark"
  src="{{ '_img/logo/web/mark-dark-96.png' | url }}"
  alt="{{ config.site_name }}"
  width="96"
  height="96"
/>
