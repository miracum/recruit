query-sql-on-fhir:
  version: "10.5.7" # x-release-please-version
  schedule:
    # every 1 hour
    cron: "@hourly"
  # max number of patients' (ResearchSubject + per-criterion Observation) entries per transaction
  # bundle - a study's full candidate set is submitted as one or more bundles of at most this size,
  # rather than a single unbounded transaction, to stay under the FHIR server's transaction limits.
  transaction-bundle-chunk-size: 500

fhir:
  url: ""
  server:
    # call, connect, read, and write timeout to the FHIR server in seconds
    timeout-in-seconds: 300
  use-upsert-instead-of-conditional-update: false
  systems:
    screening-list-identifier: "https://fhir.miracum.org/uc1/NamingSystem/screeningListId"
    screening-list-study-reference-extension: "https://fhir.miracum.org/uc1/StructureDefinition/belongsToStudy"
    screening-list-code-system: "https://fhir.miracum.org/uc1/CodeSystem/screeningList"
    # custom, non-standard code identifying the synthetic per-criterion eligibility Observations
    # this module creates, distinguishing them from genuine clinical Observations elsewhere.
    eligibility-observation-category-system: "https://fhir.miracum.org/uc1/CodeSystem/observation-category"
    # Observation.derivedFrom doesn't accept Library as a target type, so the criterion Library is
    # referenced via this extension instead; Observation.focus carries the ResearchStudy.
    eligibility-observation-library-extension: "https://fhir.miracum.org/uc1/StructureDefinition/derivedFromLibrary"
    # business identifier used as the conditional-update key for per-criterion Observations, since
    # the library extension above isn't a searchable parameter without a custom SearchParameter
    # registered on the FHIR server - identifier is a standard, always-searchable parameter instead.
    eligibility-observation-identifier-system: "https://fhir.miracum.org/uc1/NamingSystem/eligibilityObservationId"
    # read off ResearchStudy to populate the belongsToStudy extension's Reference.display on the
    # screening List - list-next reads the trial's acronym from that display text, not by
    # resolving the ResearchStudy itself (see ScreeningListService.cs).
    research-study-acronym-extension: "https://www.medizininformatik-initiative.de/fhir/modul-studie/StructureDefinition/mii-ex-studie-akronym"

# base URL of a sql-on-fhir server (e.g. Pathling) implementing the $sqlquery-run operation.
# only required if any of the polled SQLQuery Library resources depend on ViewDefinitions
# (via relatedArtifact) or use a SQL dialect other than trino.
sql-on-fhir:
  url: ""

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %X %n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"

spring:
  datasource:
    driver-class-name: io.trino.jdbc.TrinoDriver
    url: ""
    username: ""
    password: ""
  profiles:
    active: dev
  application:
    name: query-sql-on-fhir

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"

server:
  shutdown: graceful
