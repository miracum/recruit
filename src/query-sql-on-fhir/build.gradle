 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'org.miracum.recruit.java-application-conventions'
}

// Spring Boot's own BOM (imported by java-application-conventions via io.spring.dependency-management)
// pins io.opentelemetry:opentelemetry-api to a version older than what opentelemetry-spring-boot-starter
// below was built against, which silently downgrades it on the classpath and breaks at runtime
// (NoClassDefFoundError: io/opentelemetry/api/impl/InstrumentationUtil, since opentelemetry-api-incubator
// still resolves to the newer, matching version). Importing OTel's own BOMs here overrides Spring's pins
// for every io.opentelemetry(.instrumentation) artifact so the whole graph stays mutually consistent.
dependencyManagement {
    imports {
        mavenBom 'io.opentelemetry:opentelemetry-bom:1.64.0'
        mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.30.0-alpha'
    }
}

dependencies {
    implementation project(':fhir-constants')

    implementation 'com.github.slugify:slugify:4.0.1'
    implementation 'io.github.diz-uker:to-fhir-starter:0.2.14'
    implementation 'io.github.diz-uker:fhir-ig-constants:0.2.14'

    // https://mvnrepository.com/artifact/io.trino/trino-jdbc
    implementation 'io.trino:trino-jdbc:482'

    // Reads the standard OTEL_* env vars itself (see application.yml) and, via classpath
    // detection, auto-instruments the JdbcTemplate-backed Trino DataSource and the @Scheduled
    // poll cycle - no javaagent required. It doesn't reach the FHIR client below though: that's a
    // manually-built OkHttpClient (see FhirConfig), not a Spring-managed bean the starter can
    // find, so it's traced explicitly with the okhttp instrumentation library instead.
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-okhttp-3.0'
    // The starter's @Scheduled instrumentation (the poll cycle's root span) is an @Aspect - without
    // aspectjweaver on the classpath it's created but never woven in, so the cycle's FHIR/JDBC spans
    // end up as unrelated traces instead of children of one "poll" span. Verified via a local bootRun
    // against the logging exporter: absent, no scheduling span appears at all despite the FHIR/JDBC
    // ones exporting fine.
    implementation 'org.aspectj:aspectjweaver'

    testImplementation 'com.approvaltests:approvaltests:31.0.0'
    testImplementation 'com.google.code.gson:gson:2.14.0'
}
