/*
 * Typed Java constants (CodeSystem/Profile/Extension canonical URLs) for the recruIT FHIR
 * Implementation Guide (../../fhir/ig), generated via ig-codegen. See README.md for how to
 * regenerate.
 */

plugins {
    id 'org.miracum.recruit.java-library-conventions'
}

// Only used to run the generator below, not part of the published module's dependencies.
configurations {
    codegen
}

dependencies {
    codegen 'io.github.diz-uker:ig-codegen:0.2.10'

    // CodeSystems with inline concepts (content == "complete") get a generated enum whose
    // coding() accessor returns a org.hl7.fhir.r4.model.Coding - part of the public API, so 'api'
    // rather than 'implementation'.
    api 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.10.0'
    // Generated enums carry JSpecify @NonNull/@Nullable on their public API - part of the public
    // type contract, so consumers can use them without adding jspecify themselves.
    api 'org.jspecify:jspecify:1.0.0'
}

// Copies the FHIR resources sushi generates from fhir/ig/input/fsh into the flat npm-style
// package layout ig-codegen expects (<fhirPackagesDir>/<packageName>/*.json). The recruit IG
// isn't published to a FHIR package registry, so there's nothing for `fhir restore`/`npm
// install` to fetch here - sushi's own output is the only copy of these resources.
tasks.register('syncRecruitIgResources', Copy) {
    from layout.projectDirectory.dir('../../fhir/ig/fsh-generated/resources')
    into layout.buildDirectory.dir('fhir-packages/recruit')
    include '*.json'
}

// Manually-invoked "generate, review, commit" dev tool - not a build-graph participant. See
// ig-codegen/README.md (in the ig-codegen source repo) for the rationale: don't wire this output
// dir as a custom @OutputDirectory task, and don't make it configuration-cache compatible, since
// its input (the sushi-built recruit IG) isn't tracked as a Gradle input either.
tasks.register('generateIgConstants', JavaExec) {
    group = 'codegen'
    description = 'Regenerates the constant classes in src/main/java from package.json. Review the diff and commit.'
    dependsOn tasks.named('syncRecruitIgResources')
    classpath = configurations.codegen
    mainClass = 'io.github.dizuker.igcodegen.IgCodegen'
    args = [
        layout.projectDirectory.file('package.json').asFile.path,
        layout.buildDirectory.dir('fhir-packages').get().asFile.path,
        layout.projectDirectory.dir('src/main/java').asFile.path,
    ]
    notCompatibleWithConfigurationCache('reads from the sushi-built fhir/ig/fsh-generated output')
}
