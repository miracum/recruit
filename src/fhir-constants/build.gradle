/*
 * Typed Java constants (CodeSystem/Profile/Extension canonical URLs) for the recruIT FHIR
 * Implementation Guide (../../fhir/ig), generated via ig-codegen. See README.md for how to
 * regenerate.
 */

// Scoped to this build script only (not buildSrc): ig-codegen backs the generateIgConstants task
// below and nothing else in this module - it has no business being on every other module's build
// script classpath.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.diz-uker:ig-codegen:0.2.14'
    }
}

import io.github.dizuker.igcodegen.IgPackageScanner
import io.github.dizuker.igcodegen.JavaConstantsGenerator
import tools.jackson.databind.ObjectMapper

plugins {
    id 'org.miracum.recruit.java-library-conventions'
}

dependencies {
    // CodeSystems with inline concepts (content == "complete") get a generated enum whose
    // coding() accessor returns a org.hl7.fhir.r4.model.Coding - part of the public API, so 'api'
    // rather than 'implementation'.
    api 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.10.0'
    // Generated enums carry JSpecify @NonNull/@Nullable on their public API - part of the public
    // type contract, so consumers can use them without adding jspecify themselves.
    api 'org.jspecify:jspecify:1.0.0'
}

// Manually-invoked "generate, review, commit" dev tool - not a build-graph participant. See
// README.md for the rationale. Scans fhir/ig/fsh-generated/resources directly via ig-codegen's
// lower-level scanner/generator API, rather than IgCodegen's own CLI entry point, which expects a
// package.json plus a Firely Terminal/npm package cache - there's nothing to restore for an IG
// that isn't published to a FHIR package registry; sushi's own output is the only copy.
tasks.register('generateIgConstants') {
    group = 'codegen'
    description = 'Regenerates the constant classes in src/main/java from fhir/ig/fsh-generated/resources. Review the diff and commit.'
    def resourcesDir = layout.projectDirectory.dir('../../fhir/ig/fsh-generated/resources')
    def outputDir = layout.projectDirectory.dir('src/main/java')
    doLast {
        def scanner = new IgPackageScanner(new ObjectMapper())
        def model = scanner.scan(resourcesDir.asFile.toPath(), 'io.github.miracum.recruit', '0.1.0')
        def generatedFile = JavaConstantsGenerator.writeTo(
            model, 'io.github.miracum.recruit', 'Recruit', outputDir.asFile.toPath())
        logger.lifecycle('Generated {}', generatedFile)
    }
    notCompatibleWithConfigurationCache('reads from the sushi-built fhir/ig/fsh-generated output, not a declared task input')
}
