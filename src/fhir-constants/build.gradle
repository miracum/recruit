/*
 * Typed Java constants (CodeSystem/Profile/Extension canonical URLs) for the recruIT FHIR
 * Implementation Guide (../../fhir/ig), generated via ig-codegen. See README.md for how to
 * regenerate.
 */

// Scoped to this build script only (not buildSrc): ig-codegen backs the generateIgConstants task
// below and nothing else in this module - it has no business being on every other module's build
// script classpath.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.diz-uker:ig-codegen:0.2.21'
    }
}

import io.github.dizuker.igcodegen.IgPackageScanner
import io.github.dizuker.igcodegen.JavaConstantsGenerator
import tools.jackson.databind.ObjectMapper

plugins {
    id 'org.miracum.recruit.java-library-conventions'
}

dependencies {
    api 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.12.1'
    api 'org.jspecify:jspecify:1.0.1'
}

tasks.register('generateIgConstants') {
    group = 'codegen'
    description = 'Regenerates the constant classes'
    def resourcesDir = layout.projectDirectory.dir('../../fhir/ig/fsh-generated/resources')
    def conformanceResourcesDir = layout.buildDirectory.dir('ig-conformance-resources')
    def outputDir = layout.projectDirectory.dir('src/main/java')
    doLast {
        // ig-codegen reads every resource's `type` as a string, which fails on example instances
        // whose `type` is a CodeableConcept (e.g. Library), so only the conformance resources are
        // scanned. See https://github.com/diz-uker/to-fhir/issues/113.
        def scanDir = conformanceResourcesDir.get().asFile
        project.delete(scanDir)
        project.copy {
            from resourcesDir
            include 'CodeSystem-*.json', 'ValueSet-*.json', 'StructureDefinition-*.json',
                'NamingSystem-*.json', 'SearchParameter-*.json', 'ImplementationGuide-*.json'
            into scanDir
        }
        def scanner = new IgPackageScanner(new ObjectMapper())
        def model = scanner.scan(scanDir.toPath(), 'dev.openrecruit.fhir', '0.1.0')
        def generatedFile = JavaConstantsGenerator.writeTo(
            model, 'io.github.miracum.recruit', 'Recruit', outputDir.asFile.toPath())
        logger.lifecycle('Generated {}', generatedFile)
    }
    notCompatibleWithConfigurationCache('reads from the sushi-built fhir/ig/fsh-generated output')
}
