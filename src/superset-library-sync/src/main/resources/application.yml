superset:
  # dialect label added as a second, dialect-specific content attachment alongside the default
  # untyped "application/sql" one - set blank to skip it.
  sql-dialect: "trino"

sync:
  # when true, Library resources are built and logged but not submitted to the FHIR server -
  # lets a run be previewed before it's allowed to actually change server state.
  dry-run: false
  kafka:
    # optional: when true, every synced Library's PUT bundle is published, as FHIR+JSON, to
    # `topic` instead of being submitted to the FHIR server. Requires `topic` to be set; Kafka
    # connectivity itself (brokers, SSL, etc.) is the spring.kafka.* block below, shared with
    # miracum/kafka-fhir-to-server and miracum/fhir-gateway so the same secrets/config can be
    # reused across all three.
    enabled: false
    topic: ""

fhir:
  url: ""
  server:
    timeout-in-seconds: 300

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ""
    username: ""
    password: ""
  profiles:
    active: dev
  application:
    name: superset-library-sync
  main:
    banner-mode: off
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    ssl:
      trust-store-type: PKCS12
      trust-store-location: file://${SSL_TRUST_STORE:/opt/kafka-certs/ca.p12}
      trust-store-password: ${KAFKA_SSL_TRUST_STORE_PASSWORD:}
      key-store-type: PKCS12
      key-store-location: file://${SSL_KEY_STORE_FILE:/opt/kafka-certs/user.p12}
      key-store-password: ${KAFKA_SSL_KEY_STORE_PASSWORD:}
    producer:
      compression-type: ${KAFKA_PRODUCER_COMPRESSION_TYPE:zstd}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:262144}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.miracum.kafka.serializers.KafkaFhirSerializer
      properties:
        compression.zstd.level: ${KAFKA_PRODUCER_COMPRESSION_ZSTD_LEVEL:9}
  cloud:
    stream:
      default:
        producer:
          use-native-encoding: true

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(---){faint} %m %X %n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"
