apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: recruit
build:
  artifacts:
    - image: ghcr.io/miracum/recruit/query
      docker:
        dockerfile: Dockerfile
        buildArgs:
          MODULE: query
    - image: ghcr.io/miracum/recruit/query-sql-on-fhir
      docker:
        dockerfile: Dockerfile
        buildArgs:
          MODULE: query-sql-on-fhir
    - image: ghcr.io/miracum/recruit/notify
      docker:
        dockerfile: Dockerfile
        buildArgs:
          MODULE: notify
    - image: ghcr.io/miracum/recruit/list-next
      docker:
        dockerfile: Dockerfile
        buildArgs:
          MODULE: list-next
    - image: ghcr.io/miracum/recruit/list
      context: list
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VERSION: "{{ .IMAGE_TAG }}"
  local:
    push: false
    tryImportMissing: true
    useBuildkit: true
manifests:
  helm:
    flags:
      install:
        - --timeout=15m
    releases:
      - name: recruit
        chartPath: ../charts/recruit
        createNamespace: true
        namespace: recruit
        valuesFiles:
          - hack/k8s/values-dev.yaml
        wait: true
        skipBuildDependencies: true
deploy:
  helm:
    releases:
      - name: recruit
        chartPath: helm
        createNamespace: true
        namespace: recruit
        valuesFiles:
          - hack/k8s/values-dev.yaml
        skipBuildDependencies: true
    flags:
      install:
        - --timeout=15m
