apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: recruit
build:
  artifacts:
    - image: ghcr.io/open-recruit/recruit/query-sql-on-fhir
      docker:
        dockerfile: Dockerfile
        buildArgs:
          MODULE_NAME: query-sql-on-fhir
    - image: ghcr.io/open-recruit/recruit/list
      context: list
      docker:
        dockerfile: Dockerfile
  local:
    push: false
    tryImportMissing: true
    useBuildkit: true
deploy:
  helm:
    flags:
      install:
        - --timeout=15m
    releases:
      - name: recruit
        chartPath: ../charts/recruit
        createNamespace: true
        namespace: recruit
        valuesFiles:
          - hack/k8s/values-dev.yaml
        wait: true
        skipBuildDependencies: true
        # point the chart at the images skaffold just built. The keys are the artifact image names
        # above with every non-alphanumeric character replaced by `_`.
        setValueTemplates:
          list.image.registry: "{{.IMAGE_DOMAIN_ghcr_io_open_recruit_recruit_list}}"
          list.image.repository: "{{.IMAGE_REPO_NO_DOMAIN_ghcr_io_open_recruit_recruit_list}}"
          list.image.tag: "{{.IMAGE_TAG_ghcr_io_open_recruit_recruit_list}}"
          querySqlOnFhir.image.registry: "{{.IMAGE_DOMAIN_ghcr_io_open_recruit_recruit_query_sql_on_fhir}}"
          querySqlOnFhir.image.repository: "{{.IMAGE_REPO_NO_DOMAIN_ghcr_io_open_recruit_recruit_query_sql_on_fhir}}"
          querySqlOnFhir.image.tag: "{{.IMAGE_TAG_ghcr_io_open_recruit_recruit_query_sql_on_fhir}}"
